name: Auto Sync

# ─────────────────────────────────────────────────────────────────────────────
# ⚡ UNIFIED SYNC PIPELINE — 7 syncs en PARALLÈLE → publication via GitHub Release
# (v4 — 2026-09-03 : boucle continue vraie — le run suivant démarre dès que
#  le précédent est TERMINÉ, pause 20 s seulement. Avant : 7 jobs en série
#  + sleep 120 → cycle ~24 min. Après : jobs indépendants en parallèle →
#  cycle ~7-8 min = le plus long des syncs, données 3× plus fraîches.)
#
# SÉCURITÉ PARALLÈLE : chaque job pousse ses PROPRES assets (ensembles
# disjoints, aucun nom partagé) — les uploads concurrents sur la même release
# ne se marchent pas dessus. Seule vraie dépendance : sync-dashboard lit le
# ranked.json PUBLIÉ PAR sync-ranked du même run (needs conservé).
#
# Chaque sync génère des fichiers DIFFÉRENTS dans le runner :
#   - sync-standard     → runs_public.json.gz (payload optimisé), runs.json.gz
#   - sync-compact      → runs_compact_public.json.gz, runs_compact.json.gz
#   - sync-teams        → teams_public.json.gz, teams_runs.json
#   - sync-ranked       → ranked.json, ranked_history.json.gz
#   - sync-dashboard    → dashboard_scores.json, dashboard_ranking.json
#   - sync-player-games → player-data/, player-stats/ (tarball)
#   - sync-lobby-state  → lobby_state.json
#
# 🔄 TRANSPORT (v3 — audit 2026-08-27) : le PUSH HTTP vers _upload.php est
# impossible depuis GitHub Actions (le WAF o2switch coupe les POST des IP
# Azure : curl error 56, même sur 118 octets, même en raw-body). Les fichiers
# sont donc publiés en ASSETS de la release publique « data-latest », et le
# serveur o2switch les PULL via son cron (pull-data.sh, GET publics).
#
# Boucle d'état : chaque job RETÉLÉCHARGE ses fichiers d'état depuis la
# release au démarrage (seen.json, checkpoint.json, historiques…) — ils ne
# sont plus commités dans git (pas de gonflement du repo).
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-sync-v2
  # FIABILITÉ (2026-09-03) : avant = true → chaque nouveau run annulait le
  # courant. En chaîne continue (job rechain ci-dessous), il faut au contraire
  # laisser finir le run en cours ; le group conserve 1 run en attente max.
  cancel-in-progress: false

jobs:
  sync-standard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      # Scripts en ESM → type=module dans package.json (npm init sans réseau,
      # fetch natif Node 20 : pas besoin de node-fetch)
      - run: npm init -y --silent && node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: État depuis la release
        run: |
          chmod +x scripts/data-release.sh
          ./scripts/data-release.sh pull runs.json.gz seen.json checkpoint.json
      # TOLÉRANT : un échec transitoire d'API ne doit pas casser la chaîne
      # (l'état étant publié en release, le run suivant rattrape la fenêtre)
      - run: node sync.js || echo "::warning::sync.js a échoué — rattrapé au prochain cycle"
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
          SYNC_HISTORY_WINDOWS: "500"
      - name: Publier les données (release data-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/data-release.sh
          ./scripts/data-release.sh push runs_public.json.gz runs_public.json clans.json news.json seen.json checkpoint.json runs.json.gz

  sync-compact:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm init -y --silent && node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: État depuis la release
        run: |
          chmod +x scripts/data-release.sh
          ./scripts/data-release.sh pull runs_compact.json.gz seen_compact.json checkpoint_compact.json
      - run: node sync.js --mode=compact || echo "::warning::sync compact a échoué — rattrapé au prochain cycle"
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
          COMPACT_HISTORY_WINDOWS: "500"
      - name: Publier les données (release data-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/data-release.sh
          ./scripts/data-release.sh push runs_compact_public.json.gz runs_compact_public.json seen_compact.json checkpoint_compact.json runs_compact.json.gz

  sync-teams:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm init -y --silent && node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: État depuis la release
        run: |
          chmod +x scripts/data-release.sh
          ./scripts/data-release.sh pull teams_runs.json teams_seen.json teams_checkpoint.json
      - run: node sync-teams.js || echo "::warning::sync-teams a échoué — rattrapé au prochain cycle"
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
      - name: Publier les données (release data-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/data-release.sh
          ./scripts/data-release.sh push teams_runs.json teams_seen.json teams_checkpoint.json teams_public.json teams_public.json.gz

  sync-ranked:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm init -y --silent && node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: État depuis la release
        run: |
          chmod +x scripts/data-release.sh
          ./scripts/data-release.sh pull ranked.json ranked_history.json.gz ranked_2v2_history.json.gz
          # sync-ranked.js lit les historiques NON compressés
          for f in ranked_history ranked_2v2_history; do
            if [[ -f "$f.json.gz" && ! -f "$f.json" ]]; then gunzip -k "$f.json.gz"; fi
          done
      - run: node sync-ranked.js || echo "::warning::sync-ranked a échoué — rattrapé au prochain cycle"
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
      - name: Publier les données (release data-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/data-release.sh
          ./scripts/data-release.sh push ranked.json ranked.json.gz ranked_history.json.gz ranked_2v2_history.json.gz

  sync-dashboard:
    needs: [sync-ranked]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm init -y --silent && node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: Entrées depuis la release
        run: |
          chmod +x scripts/data-release.sh
          # sync-dashboard.js consomme le ranked.json produit par le job précédent
          # + weekly_history.json.gz = historique hebdo persistant (profil S1→S53)
          ./scripts/data-release.sh pull ranked.json weekly_history.json.gz
      - run: node sync-dashboard.js || echo "::warning::sync-dashboard a échoué — rattrapé au prochain cycle"
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
      - name: Publier les données (release data-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/data-release.sh
          ./scripts/data-release.sh push dashboard_scores.json dashboard_scores.json.gz dashboard_ranking.json dashboard_player_games.json weekly_history.json.gz weekly_history.json

  sync-player-games:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: État depuis la release
        run: |
          chmod +x scripts/data-release.sh
          ./scripts/data-release.sh pull player-files.tar.gz sync-players.json
          if [[ -f player-files.tar.gz ]]; then
            tar xzf player-files.tar.gz
            echo "  📦 player-data/ et player-stats/ restaurés"
          fi
      - name: Detect new players from Firebase
        run: node detect-new-players.js || true
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
      - name: Sync player games (tolérant — rattrapé au prochain cycle sinon)
        run: node sync-player-games.js || echo "::warning::sync-player-games a échoué"
        env:
          SKAILEX_ACCESS_TOKEN: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
      - name: Compute player stats
        run: node compute-player-stats.js || echo "::warning::compute-player-stats a échoué"
      - name: Publier les données (release data-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/data-release.sh
          tar czf player-files.tar.gz player-data player-stats
          ./scripts/data-release.sh push player-files.tar.gz sync-players.json

  sync-lobby-state:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1, ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm init -y --silent && npm install node-fetch@2 ws@8 --silent && node -e "const p=require('./package.json');p.type='module';require('fs').writeFileSync('package.json',JSON.stringify(p,null,2))"
      - run: node sync-lobby-state.js || echo "::warning::sync-lobby-state a échoué — rattrapé au prochain cycle"
        env:
          OPENFRONT_SKAILEX_ACCESS: ${{ secrets.OPENFRONT_SKAILEX_ACCESS }}
      - name: Publier les données (release data-latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/data-release.sh
          ./scripts/data-release.sh push lobby_state.json

  # ═══════════════════════════════════════════════════════════════════════════
  # RECHAIN — BOUCLE CONTINUE (v4, 2026-09-03)
  #
  # Le cycle suivant est déclenché DÈS QUE tout le monde a fini (20 s de
  # garde seulement). C'est une vraie boucle : fin de sync → relance.
  # Avant (v3) : pause fixe de 2 min + jobs en série → cycle ~24 min.
  # Après (v4) : jobs parallèles + relance immédiate → cycle ~7-8 min.
  #
  # ROBUSTESSE :
  #   - if: always() → même si un sync échoue, la boucle CONTINUE (pause de
  #     5 min pour ne pas marteler l'API en cas d'échec rapide répété).
  #   - !cancelled() → un Cancel manuel de l'utilisateur stoppe la boucle.
  #   - Le schedule */5 reste en secours (maintenance GitHub, token expiré…).
  #
  # PROBLÈME HISTORIQUE (v3) : le schedule GitHub (cron */5) est massivement
  # retardé en charge — écarts de 2 à 5 h constatés. La boucle via
  # workflow_dispatch (API, hors scheduler) contourne complètement ça.
  #
  # Prérequis : secret GH_SYNC_TOKEN = PAT du propriétaire (scopes repo).
  # Pour stopper la boucle : onglet Actions → « Auto Sync » → ⋯ → Disable.
  # ═══════════════════════════════════════════════════════════════════════════
  rechain:
    needs: [sync-standard, sync-compact, sync-teams, sync-ranked, sync-dashboard, sync-player-games, sync-lobby-state]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    timeout-minutes: 8
    steps:
      - name: Relance immédiate du cycle suivant (workflow_dispatch)
        env:
          GH_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
          ANY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$ANY_FAILED" = "true" ]; then
            echo "⚠️ Au moins un sync a échoué — pause 5 min (anti-emballement) puis relance"
            sleep 300
          else
            echo "✅ Cycle complet réussi — relance dans 20 s (boucle continue)"
            sleep 20
          fi
          code=$(curl -s -o /tmp/dispatch.out -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sync.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch HTTP $code"
          cat /tmp/dispatch.out 2>/dev/null || true
          if [ "$code" != "204" ]; then
            echo "::warning::dispatch a échoué (HTTP $code) — le schedule */5 reprendra la relève"
          fi
