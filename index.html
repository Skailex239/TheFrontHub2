<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>TheFrontHub — Site en refonte</title>
<meta name="description" content="TheFrontHub, le hub communautaire pour OpenFront.io, est momentanément en refonte. Revenez bientôt.">
<meta name="robots" content="index, follow">
<link rel="icon" type="image/png" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="180x180" href="favicon-180x180.png">
<link rel="apple-touch-icon" sizes="180x180" href="favicon-180x180.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: radial-gradient(1200px 700px at 50% -10%, #131c2b 0%, #0b0f17 55%, #080b11 100%);
    color: #dbe2ef;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 48px 20px 32px;
  }
  .logo {
    width: min(420px, 78vw);
    height: auto;
    filter: drop-shadow(0 8px 30px rgba(0,0,0,.55));
    animation: rise .8s ease both;
  }
  h1 {
    margin: 28px 0 8px;
    font-size: clamp(26px, 5vw, 40px);
    letter-spacing: .02em;
    color: #fff;
    animation: rise .8s .1s ease both;
  }
  p.sub {
    margin: 0 0 26px;
    color: #93a0b4;
    max-width: 520px;
    animation: rise .8s .2s ease both;
  }
  .pulse {
    width: 42px; height: 42px;
    border: 3px solid #223047;
    border-top-color: #e8b64c;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 26px;
  }
  footer {
    margin-top: auto;
    padding: 18px 20px calc(18px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid #17202e;
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
    justify-content: center;
    font-size: 14px;
    color: #7f8ba0;
  }
  footer a { color: #c9d4e8; text-decoration: none; }
  footer a:hover { text-decoration: underline; color: #fff; }
  .copy { width: 100%; text-align: center; color: #5d6880; font-size: 13px; margin-top: 4px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <main>
    <img class="logo" src="TheFrontHub LOGO WHITE TEXT.png" alt="TheFrontHub">
    <h1>Site en refonte</h1>
    <p class="sub">TheFrontHub revient bientôt avec une nouvelle version.
    Toutes les données de jeu continuent d'être collectées en arrière-plan pendant ce temps.</p>
    <div class="pulse" role="status" aria-label="Refonte en cours"></div>
  </main>
  <footer>
    <a href="legal.html">Mentions légales</a>
    <a href="privacy.html">Confidentialité &amp; cookies</a>
    <a href="https://discord.gg/AZhmqRvbNh" target="_blank" rel="noreferrer">Discord</a>
    <a href="https://openfront.io" target="_blank" rel="noreferrer">Jouer à OpenFront ↗</a>
    <span class="copy">© 2026 TheFrontHub — site de fans, non affilié à OpenFront.io</span>
  </footer>
</body>
</html>
