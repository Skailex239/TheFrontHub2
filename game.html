<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>TheFrontHub — Partie</title>
  <meta name="description" content="Détail d'une partie OpenFront : roster complet, clans, vainqueur et configuration.">
<link rel="canonical" href="https://thefronthub.com/game.html">
<link rel="alternate" hreflang="fr" href="https://thefronthub.com/game.html">
<link rel="alternate" hreflang="x-default" href="https://thefronthub.com/game.html">
  <link rel="icon" type="image/png" href="favicon-32x32.png">
  <link rel="stylesheet" href="styles.css?v=95">
  <style>
    :root { --gp-radius: 14px; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; margin: 0; }
    .gp-wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 48px; }
    .gp-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
    .gp-top img { height: 34px; }
    .gp-back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 14px; padding: 8px 14px; border: 1px solid var(--border); border-radius: 999px; transition: all .15s; }
    .gp-back:hover { color: var(--orange); border-color: var(--orange); }
    .gp-card { background: var(--panel, var(--bg)); border: 1px solid var(--border); border-radius: var(--gp-radius); padding: 20px; margin-bottom: 16px; }
    .gp-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
    .gp-title h1 { font-size: 26px; margin: 0; font-weight: 800; }
    .gp-badge { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--orange) 14%, transparent); color: var(--orange); border: 1px solid color-mix(in srgb, var(--orange) 35%, transparent); }
    .gp-badge.win { background: rgba(16,185,129,.12); color: #10b981; border-color: rgba(16,185,129,.4); }
    /* v5.16 — badge de version du jeu (era = v34, full = v0.34.5 en info-bulle) */
    .gp-badge.ver { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .3px; }
    .gp-notice { display: flex; gap: 10px; align-items: flex-start; border: 1px dashed color-mix(in srgb, var(--orange) 45%, transparent); background: color-mix(in srgb, var(--orange) 7%, transparent); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; color: var(--fg, inherit); margin-top: 10px; }
    .gp-sub { color: var(--muted); font-size: 13.5px; margin: 2px 0 14px; }
    .gp-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .gp-stat { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .gp-stat b { display: block; font-size: 18px; }
    .gp-stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
    .gp-config { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; font-size: 13px; }
    .gp-config div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--border); padding: 5px 2px; }
    .gp-config span { color: var(--muted); }
    .gp-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .gp-table th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); padding: 8px 10px; border-bottom: 2px solid var(--border); }
    .gp-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
    .gp-table tr:last-child td { border-bottom: none; }
    .gp-table tr.winner td { background: rgba(16,185,129,.06); }
    .gp-player { color: inherit; text-decoration: none; font-weight: 600; }
    .gp-player:hover { color: var(--orange); }
    .gp-clan { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--orange) 12%, transparent); color: var(--orange); text-decoration: none; border: 1px solid color-mix(in srgb, var(--orange) 30%, transparent); }
    .gp-clan:hover { background: var(--orange); color: #fff; }
    .gp-team { font-size: 11px; font-weight: 700; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 2px 7px; }
    .gp-team.t0 { color: #f59e0b; border-color: rgba(245,158,11,.4); }
    .gp-team.t1 { color: #3b82f6; border-color: rgba(59,130,246,.4); }
    .gp-team.t2 { color: #10b981; border-color: rgba(16,185,129,.4); }
    .gp-team.t3 { color: #ef4444; border-color: rgba(239,68,68,.4); }
    .gp-cos { display: inline-block; width: 18px; height: 18px; border-radius: 4px; margin-right: 4px; background: var(--border); vertical-align: middle; }
    .gp-empty { color: var(--muted); text-align: center; padding: 30px 0; }
    .gp-loading { display: flex; align-items: center; justify-content: center; gap: 12px; color: var(--muted); padding: 60px 0; }
    .gp-spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--orange); border-radius: 50%; animation: gp-spin .8s linear infinite; }
    @keyframes gp-spin { to { transform: rotate(360deg); } }
    .gp-err { text-align: center; color: #ef4444; padding: 40px 0; }
    @media (max-width: 640px) { .gp-table th:nth-child(n+4), .gp-table td:nth-child(n+4) { display: none; } .gp-title h1 { font-size: 20px; } }
  </style>
</head>
<body>
  <div class="gp-wrap">
    <div class="gp-top">
      <img src="TheFrontHub%20Logo%20Text.webp" alt="TheFrontHub">
      <a class="gp-back" href="dashboard.html">← Tableau de bord</a>
      <a class="gp-back" href="index.html">Speedruns</a>
    </div>

    <div id="gp-root">
      <div class="gp-loading"><div class="gp-spinner"></div> Chargement de la partie…</div>
    </div>
  </div>

<script>
(function () {
  'use strict';
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var fmtDate = function (ms) {
    if (!ms) return '—';
    try { return new Date(ms).toLocaleString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return '—'; }
  };
  var fmtDur = function (s) {
    s = Number(s) || 0;
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return (h ? h + 'h ' : '') + (m < 10 && h ? '0' : '') + m + 'm ' + (r < 10 ? '0' : '') + r + 's';
  };
  var profUrl = function (name, pid) {
    return 'profile.html?player=' + encodeURIComponent(name || '') + (pid ? '&publicId=' + encodeURIComponent(pid) : '');
  };
  /* v5.13 — badge « joueur vérifié » (données route=game ; bulle CSS de
   * styles.css — la page roster n'est pas en overflow contraint). */
  var vBadge = function (p) {
    if (!p || !p.verified || !p.publicId) return '';
    var tip = 'Joueur vérifié — cette personne est vérifiée (identité prouvée en jeu)';
    return '<span class="tfh-vbadge" data-tip="' + esc(tip) + '" title="' + esc(tip) + '" tabindex="0" role="img" aria-label="' + esc(tip) + '">' +
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="tfh-vbadge-ic" aria-hidden="true"><path d="M12 2.2l2.3 1.9 3-.3.9 2.9 2.6 1.5-1 2.9 1 2.9-2.6 1.5-.9 2.9-3-.3-2.3 1.9-2.3-1.9-3 .3-.9-2.9L3.2 14l1-2.9-1-2.9 2.6-1.5.9-2.9 3 .3z"/><path d="M8.6 12l2.4 2.4 4.4-4.9"/></svg></span>';
  };

  function pickStats(st) {
    if (!st || typeof st !== 'object') return [];
    var out = [], keys = ['tiles', 'troops', 'workers', 'gold', 'attacks', 'defenses', 'allies'];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (st[k] != null && !isNaN(Number(st[k]))) out.push([k, Number(st[k]).toLocaleString('fr-FR')]);
    }
    if (!out.length) {
      // fallback : 3 premières paires numériques
      var n = 0;
      for (var p in st) {
        if (n >= 3) break;
        if (st[p] != null && !isNaN(Number(st[p])) && typeof st[p] !== 'object') { out.push([p, Number(st[p]).toLocaleString('fr-FR')]); n++; }
      }
    }
    return out;
  }

  var COS_BASE = 'https://openfront.io/cosmetics/';
  function cosImgs(c) {
    if (!c || typeof c !== 'object') return '';
    var html = '', n = 0;
    ['flag', 'emblem', 'pattern', 'nameColor', 'icon'].forEach(function (cat) {
      var v = c[cat] || (c[cat + 'Id']);
      if (v && typeof v === 'string' && n < 4) {
        html += '<span class="gp-cos" title="' + esc(cat + ': ' + v) + '" style="background:linear-gradient(135deg,var(--orange) 0%,#fbbf24 100%)"></span>';
        n++;
      }
    });
    return html;
  }

  function render(g) {
    var root = document.getElementById('gp-root');
    var winner = g.winner || {};
    var winRow = null;
    var players = (g.players || []).slice().sort(function (a, b) {
      return (b.won ? 1 : 0) - (a.won ? 1 : 0) || (a.teamIndex ?? 0) - (b.teamIndex ?? 0);
    });
    var rows = players.map(function (p) {
      if (p.won) winRow = p;
      var st = pickStats(p.stats);
      var stHtml = st.length ? st.map(function (x) { return '<b>' + esc(x[1]) + '</b> ' + esc(x[0]); }).join(' · ') : '—';
      return '<tr class="' + (p.won ? 'winner' : '') + '">' +
        '<td>' + cosImgs(p.cosmetics) + '<a class="gp-player" href="' + profUrl(p.username, p.publicId) + '">' + esc(p.username) + '</a>' + vBadge(p) + '</td>' +
        '<td>' + (p.clanTag ? '<a class="gp-clan" href="clan.html?tag=' + encodeURIComponent(p.clanTag) + '">[' + esc(p.clanTag) + ']</a>' : '—') + '</td>' +
        '<td>' + (p.teamIndex != null ? '<span class="gp-team t' + (p.teamIndex % 4) + '">Équipe ' + (p.teamIndex + 1) + '</span>' : '<span class="gp-team">FFA</span>') + '</td>' +
        '<td>' + (p.won ? '<span class="gp-badge win">Vainqueur</span>' : '<span style="color:var(--muted)">—</span>') + '</td>' +
        '<td>' + stHtml + '</td>' +
        '</tr>';
    }).join('');

    /* v5.16 — version officielle du jeu (tags OpenFrontIO). Era « v34 » ;
     * tag complet en info-bulle. Null / constante analytics → pas de badge. */
    function verEra(v) {
      if (!v || v === 'v0.0.2') return null;
      var m = String(v).match(/^v?(\d+)\.(\d+)/);
      return m ? 'v' + m[2] : null;
    }
    function verBadge(v) {
      if (!v || v === 'v0.0.2') return '';
      var era = verEra(v);
      return '<span class="gp-badge ver" title="Version du jeu : ' + esc(String(v)) + '">' + esc(era || String(v)) + '</span>';
    }

    var cfg = g.config || {};
    var cfgKeys = ['gameMode', 'difficulty', 'map', 'mapSize', 'bots', ' instantBuild', 'infiniteGold', 'infiniteTroops', 'maxWorkers', 'randomSpawn', 'disableNPCs'];
    var cfgHtml = '';
    Object.keys(cfg).forEach(function (k) {
      var v = cfg[k];
      if (v == null || typeof v === 'object') return;
      cfgHtml += '<div><span>' + esc(k) + '</span><b>' + esc(String(v)) + '</b></div>';
    });

    root.innerHTML =
      '<div class="gp-card">' +
        '<div class="gp-title"><h1>' + esc(g.map || 'Carte inconnue') + '</h1>' +
          (g.mode ? '<span class="gp-badge">' + esc(g.mode) + '</span>' : '') +
          (g.rankedType ? '<span class="gp-badge">' + esc(g.rankedType) + '</span>' : '') +
          (g.speedrun ? '<span class="gp-badge">Speedrun ' + esc(fmtDur(g.speedrun.durationS)) + '</span>' : '') +
          (g.hasReplay ? '<span class="gp-badge">Replay dispo</span>' : '') +
          verBadge(g.version) +
        '</div>' +
        '<p class="gp-sub">Partie du ' + esc(fmtDate(g.startedAt)) + ' · ID <code>' + esc(g.id) + '</code>' +
          (winRow ? ' · Vainqueur : <a class="gp-player" href="' + profUrl(winRow.username, winRow.publicId) + '">' + esc(winRow.username) + '</a>' + vBadge(winRow) : (winner.username ? ' · Vainqueur : <a class="gp-player" href="' + profUrl(winner.username, winner.publicId) + '">' + esc(winner.username) + '</a>' + vBadge(winner) : '')) +
        '</p>' +
        '<div class="gp-stats">' +
          '<div class="gp-stat"><b>' + esc(String(g.numPlayers ?? '—')) + '</b><span>Joueurs</span></div>' +
          '<div class="gp-stat"><b>' + esc(g.durationS != null ? fmtDur(g.durationS) : '—') + '</b><span>Durée</span></div>' +
          '<div class="gp-stat"><b>' + esc(String(g.numTurns ?? '—')) + '</b><span>Tours</span></div>' +
          '<div class="gp-stat"><b>' + esc(g.difficulty || '—') + '</b><span>Difficulté</span></div>' +
          '<div class="gp-stat"><b>' + esc(g.mapSize || '—') + '</b><span>Taille</span></div>' +
          (g.version && g.version !== 'v0.0.2' ? '<div class="gp-stat"><b>' + esc(verEra(g.version) || esc(String(g.version))) + '</b><span>Version</span></div>' : '') +
        '</div>' +
      '</div>' +
      (cfgHtml ? '<div class="gp-card"><h2 style="margin:0 0 10px;font-size:16px">⚙️ Configuration</h2><div class="gp-config">' + cfgHtml + '</div></div>' : '') +
      '<div class="gp-card">' +
        '<h2 style="margin:0 0 10px;font-size:16px">👥 Roster (' + esc(String(players.length)) + ')</h2>' +
        (players.length ?
          '<div style="overflow-x:auto"><table class="gp-table"><thead><tr><th>Joueur</th><th>Clan</th><th>Équipe</th><th>Résultat</th><th>Stats</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
          : '<div class="gp-empty">Roster indisponible pour cette partie.</div>') +
      (g.enriching ? '<div class="gp-notice">⏳ <span><b>Détails en cours de récupération.</b> Cette partie date d\'avant septembre 2026 — l\'archive complète est en cours de backfill : carte, joueurs et stats arriveront automatiquement.</span></div>' : '') +
      '</div>';
  }

  function fail(msg) {
    document.getElementById('gp-root').innerHTML = '<div class="gp-card"><div class="gp-err">⚠️ ' + esc(msg) + '</div></div>';
  }

  document.addEventListener('DOMContentLoaded', function () {
    var id = new URLSearchParams(location.search).get('id') || '';
    if (!/^[A-Za-z0-9]{6,16}$/.test(id)) { fail('Identifiant de partie invalide ou manquant (?id=…).'); return; }
    document.title = 'TheFrontHub — Partie ' + id;
    fetch('/api/games-api.php?route=game&id=' + encodeURIComponent(id), { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok || !res.j || !res.j.ok) fail((res.j && res.j.error) ? res.j.error : 'Partie introuvable.');
        else render(res.j.game);
      })
      .catch(function () { fail('Erreur réseau en chargeant la partie.'); });
  });
})();
</script>
</body>
</html>
