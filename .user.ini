; .user.ini — Augmente les limites PHP pour le dossier web
; Permet l'upload de gros fichiers (runs.json.gz = 16+ Mo)

; Taille max d'upload via POST
upload_max_filesize = 100M

; Taille max totale des données POST
post_max_size = 110M

; Timeout d'exécution des scripts (en secondes)
; 5 min pour permettre l'upload des gros fichiers sur connexion lente
max_execution_time = 300

; Timeout d'input (temps max pour recevoir les données POST)
; 5 min aussi
max_input_time = 300

; Limite mémoire (128 Mo par défaut, on monte à 256 pour les gros fichiers)
memory_limit = 256M
